[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lottomater"
version = "1.0.0"
description = "PyQt5 Lotto 6/45 Analysis and Prediction Engine"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "PyQt5>=5.15.11",
    "PyQt5-sip>=12.20.0",
    "numpy>=2.3.2,<3",
    "pandas>=2.3.3,<4",
    "requests>=2.34.2",
    "scikit-learn>=1.7.2,<2",
    "statsmodels>=0.14.5",
    "xgboost>=3.4.1,<4",
    "lightgbm>=4.7.0,<5",
    "catboost>=1.2.10,<2",
    "torch>=2.9.0,<3",
    "jax>=0.11.2,<1",
    "openpyxl>=3.1.5,<4",
    "scipy>=1.16.1,<2",
    "psutil>=7.2.2,<8",
    "reportlab>=5.0.1,<6",
    "packaging>=25,<27"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ui*", "data*", "workers*", "core*", "utils*", "ai*"]