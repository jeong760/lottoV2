[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lottomater"
version = "1.0.0"
description = "PyQt5 Lotto 6/45 Analysis and Prediction Engine"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "PyQt5>=5.15.0",
    "numpy>=1.20.0",
    "psutil>=5.8.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ui*", "data*", "workers*", "core*", "utils*", "ai*"]